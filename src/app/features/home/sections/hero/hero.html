<section class="hero" aria-labelledby="hero-title">
  <div class="hero__content">
    <p class="hero__role">{{ hero().role }}</p>
    <h1 id="hero-title" class="hero__name">{{ hero().name }}</h1>

    <div class="hero__actions">
      <a class="hero__button" routerLink="/" fragment="projects">
        {{ hero().projectsCta }}
      </a>
      <a class="hero__button" routerLink="/" fragment="contact">
        {{ hero().contactCta }}
      </a>
    </div>
  </div>

  <div class="hero__scroll-rail">
    <a
      class="hero__scroll-button"
      routerLink="/"
      fragment="about"
      [attr.aria-label]="hero().scrollLabel"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5v13m0 0 5-5m-5 5-5-5" />
      </svg>
    </a>
    <span class="hero__rail-line"></span>
  </div>

  <aside class="hero__social-rail" aria-label="Social Media">
    <div class="hero__social-links">
      <a [href]="emailUrl" aria-label="E-Mail">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6.5h18v12H3z" />
          <path d="m4 7.5 8 6 8-6" />
        </svg>
      </a>
      <a [href]="githubUrl" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.87c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.82a9.6 9.6 0 0 1 2.5.34c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.76c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"
          />
        </svg>
      </a>
      <a [href]="linkedinUrl" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <img src="assets/icons/linkedin.svg" alt="" />
      </a>
    </div>

    <span class="hero__rail-line"></span>
  </aside>

  <div class="hero__marquee" aria-hidden="true">
    <div class="hero__marquee-track">
      <div class="hero__marquee-group">
        @for (repeat of [0, 1, 2]; track repeat) {
          @for (item of hero().ticker; track $index) {
            <span>{{ item }}</span>
            <span class="hero__separator">•</span>
          }
        }
      </div>
      <div class="hero__marquee-group">
        @for (repeat of [0, 1, 2]; track repeat) {
          @for (item of hero().ticker; track $index) {
            <span>{{ item }}</span>
            <span class="hero__separator">•</span>
          }
        }
      </div>
    </div>
  </div>
</section>
